name: Golang Test
on: [workflow_call] # yamllint disable-line rule:truthy
env:
  JUST_VERSION: "1.42.4"
  JUST_CHECKSUM: "678efc1cfbd5fa5a88375daa7e2f3864a049d6d63a0296df925a2ae5f516cb56"
permissions:
  contents: read
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Harden GitHub runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install just command runner
        run: |
          # Install pinned version of just for reproducible builds
          cd /tmp
          curl -sSfL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o just.tar.gz
          # Verify checksum for security
          echo "${JUST_CHECKSUM}  just.tar.gz" | sha256sum -c
          tar -xzf just.tar.gz
          sudo mv just /usr/local/bin/just
          chmod +x /usr/local/bin/just
          rm just.tar.gz
          just --version
      - name: Run tests with just
        run: |
          just test
          # Generate coverage for badge extraction (if needed)
          if [ -d "./bin" ]; then
            just test-coverage >/dev/null 2>&1 || true
            if [ -f "./bin/coverage.out" ]; then
              go tool cover -func=./bin/coverage.out | grep total | grep -Eo '[0-9]+\.[0-9]+' > ./bin/coverage.txt || echo '0.0' > ./bin/coverage.txt
              echo "COVERAGE=$(cat ./bin/coverage.txt)" >> "$GITHUB_ENV"
            fi
          fi

