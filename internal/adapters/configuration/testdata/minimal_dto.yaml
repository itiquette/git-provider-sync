gitprovidersync:
  defaultenv:
    defaultconf:
      provider_type: github
      domain: github.com
      owner: default-owner
      repositories:
        include:
          - default-repo
      mirrors:
        backup:
          provider_type: gitlab
          owner: backup-owner
