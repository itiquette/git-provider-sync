version: 2
run:
  timeout: 5m
output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  path-prefix: ""
issues:
  uniq-by-line: true
  exclude-dirs:
    - generated
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - dupl
linters:
  # Disable all linters.
  # Default: false
  disable-all: true
  # Enable specific linter
  # https://golangci-lint.run/usage/linters/#enabled-by-default
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    # - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    #    - exhaustruct
    - forbidigo
    - forcetypeassert
    # - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - govet
    - grouper
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    # - ireturn  # Disabled: causes issues with legitimate interface returns in factory methods
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - tagalign
    # - tagliatelle  # Disabled: JSON/YAML tag naming conventions are project-specific
    - testableexamples
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - zerologlint
linters-settings:
  forbidigo:
    # Forbid direct OS file operations in test files
    # Tests should use testutil.Test helpers instead
    forbid:
      - p: '^os\.WriteFile'
        pkg: '^.*_test$'
        msg: "Use testutil.Test.FS.WriteFile() instead of os.WriteFile in tests"
      - p: '^os\.ReadFile'
        pkg: '^.*_test$'
        msg: "Use testutil.Test.FS.ReadFile() instead of os.ReadFile in tests"
      - p: '^os\.MkdirAll'
        pkg: '^.*_test$'
        msg: "Use testutil.Test.FS.CreateDir() instead of os.MkdirAll in tests"
      - p: '^os\.Mkdir'
        pkg: '^.*_test$'
        msg: "Use testutil.Test.FS.CreateDir() instead of os.Mkdir in tests"
      - p: '^os\.MkdirTemp'
        pkg: '^.*_test$'
        msg: "Use testutil.Test.FS.TempDir() instead of os.MkdirTemp in tests"
      - p: '^os\.CreateTemp'
        pkg: '^.*_test$'
        msg: "Use testutil.Test.FS.TempFile() instead of os.CreateTemp in tests"
      - p: '^os\.Create'
        pkg: '^.*_test$'
        msg: "Use testutil.Test.FS.WriteFile() instead of os.Create in tests"
      - p: '^os\.Open'
        pkg: '^.*_test$'
        msg: "Use testutil.Test.FS.ReadFile() instead of os.Open in tests"
      - p: '^os\.Remove'
        pkg: '^.*_test$'
        msg: "Use testutil.Test.FS.Remove() instead of os.Remove in tests"
      - p: '^os\.RemoveAll'
        pkg: '^.*_test$'
        msg: "Use testutil.Test.FS.Remove() instead of os.RemoveAll in tests"
      - p: '^os\.Chdir'
        msg: "Never use os.Chdir - it affects global state and breaks parallel tests"
      - p: '^ioutil\.WriteFile'
        msg: "Use testutil.Test.FS.WriteFile() instead of ioutil.WriteFile (deprecated)"
      - p: '^ioutil\.ReadFile'
        msg: "Use testutil.Test.FS.ReadFile() instead of ioutil.ReadFile (deprecated)"
      - p: '^ioutil\.TempFile'
        msg: "Use testutil.Test.FS.TempFile() instead of ioutil.TempFile (deprecated)"
      - p: '^ioutil\.TempDir'
        msg: "Use testutil.Test.FS.TempDir() instead of ioutil.TempDir (deprecated)"
  go-vet:
    enable:
      - shadow
  varnamelen:
    min-name-length: 2
